<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Formulario de registro de nuevos usuarios." />
    <title>Formulario de registro</title>
  </head>

  <body>
    <header>
      <h1>Crear una cuenta</h1>
      <p>Completa el siguiente formulario para registrarte.</p>
    </header>

    <main>
      <form action="#" method="post">
        <fieldset>
          <legend>Datos personales</legend>

          <p>
            <label for="nombre">Nombre completo:</label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              required
              minlength="3"
              maxlength="100"
              autocomplete="name"
            />
          </p>

          <p>
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required autocomplete="email" />
          </p>

          <p>
            <label for="password">Contraseña:</label>
            <input
              type="password"
              id="password"
              name="password"
              required
              minlength="8"
              maxlength="64"
              autocomplete="new-password"
            />
            <small> La contraseña debe tener al menos 8 caracteres. </small>
          </p>

          <p>
            <label for="fecha-nacimiento">Fecha de nacimiento:</label>
            <input
              type="date"
              id="fecha-nacimiento"
              name="fecha-nacimiento"
              required
              min="1900-01-01"
              max="2026-11-12"
            />
          </p>
        </fieldset>

        <fieldset>
          <legend>Información adicional</legend>

          <p>
            <label for="pais">País de residencia:</label>
            <select id="pais" name="pais" required>
              <option value="">Selecciona un país</option>
              <option value="espana">España</option>
              <option value="francia">Francia</option>
              <option value="alemania">Alemania</option>
              <option value="italia">Italia</option>
              <option value="portugal">Portugal</option>
              <option value="otro">Otro</option>
            </select>
          </p>

          <fieldset>
            <legend>Preferencia de contacto</legend>

            <p>
              <input type="radio" id="contacto-email" name="contacto" value="email" required />
              <label for="contacto-email">Correo electrónico</label>
            </p>

            <p>
              <input type="radio" id="contacto-telefono" name="contacto" value="telefono" />
              <label for="contacto-telefono">Teléfono</label>
            </p>
          </fieldset>
        </fieldset>

        <fieldset>
          <legend>Condiciones y comentarios</legend>

          <p>
            <input type="checkbox" id="terminos" name="terminos" value="aceptados" required />
            <label for="terminos"> Acepto los términos y condiciones. </label>
          </p>

          <p>
            <label for="comentarios"> Comentarios adicionales (opcional): </label>
            <textarea
              id="comentarios"
              name="comentarios"
              rows="5"
              cols="40"
              maxlength="500"
            ></textarea>
            <small> Puedes escribir hasta 500 caracteres. </small>
          </p>
        </fieldset>

        <p>
          <button type="submit">Crear cuenta</button>
          <button type="reset">Limpiar formulario</button>
        </p>
      </form>
    </main>

    <footer>
      <p>&copy; 2026 Formulario de registro.</p>
    </footer>
  </body>
</html>
